<div class="ai-assistant">
    <div class="assistant-header">
        <div class="assistant-icon">🤖</div>
        <div>
            <h2>ИИ-ассистент</h2>
            <p>Задай вопрос по биологии</p>
        </div>
    </div>

    <div class="assistant-examples">
        <button type="button">Что такое митоз?</button>
        <button type="button">Чем мейоз отличается от митоза?</button>
        <button type="button">Что такое клетка?</button>
    </div>

    <div class="assistant-chat">
        <div class="message bot-message">
            Привет! Я помогу найти ответ в базе знаний по биологии.
        </div>
        <div id="answerBox" class="message answer-message"></div>
    </div>

    <div class="assistant-search">
        <input id="questionInput" type="text" placeholder="Напиши вопрос..." />
        <button id="askButton" type="button">Спросить</button>
    </div>
</div>
